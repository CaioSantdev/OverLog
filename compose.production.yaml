# Standalone production stack. Put an HTTPS reverse proxy in front of localhost:8080.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-overlog}
      POSTGRES_USER: ${POSTGRES_USER:-overlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina uma senha exclusiva no arquivo de ambiente}
    volumes:
      - production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-overlog}
      POSTGRES_USER: ${POSTGRES_USER:-overlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY}
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: '["${APP_ORIGIN:?Defina APP_ORIGIN com a origem HTTPS sem barra final}"]'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PRODUCTION_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  production_data:
