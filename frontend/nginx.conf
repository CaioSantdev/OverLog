worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  send_timeout 20s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 8080;
    set $api_upstream http://backend:8000;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    error_page 429 = @rate_limit;
    error_page 502 503 504 = @unavailable;
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/api/auth/(login|register)$ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
    }
    location /api/ {
      proxy_pass $api_upstream;
      proxy_set_header Host $host;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
    location @rate_limit {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"detail":"Muitas tentativas. Aguarde um minuto antes de tentar novamente."}';
    }
    location @unavailable {
      default_type application/json;
      return 503 '{"detail":"Serviço temporariamente indisponível. Tente novamente."}';
    }
  }
}
